components:
  schemas:
    Bem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 200
        tombo:
          type: string
          nullable: true
          maxLength: 50
        unidade:
          type: integer
        sala:
          type: integer
          nullable: true
        status:
          type: integer
          nullable: true
        categoria:
          type: integer
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - categoria
      - criado_em
      - id
      - nome
      - unidade
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
      required:
      - id
      - nome
    PatchedBem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 200
        tombo:
          type: string
          nullable: true
          maxLength: 50
        unidade:
          type: integer
        sala:
          type: integer
          nullable: true
        status:
          type: integer
          nullable: true
        categoria:
          type: integer
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
    PatchedCategoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
    PatchedSala:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        unidade:
          type: integer
    PatchedStatus:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
    PatchedUnidade:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        endereco:
          type: string
          maxLength: 200
    Sala:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        unidade:
          type: integer
      required:
      - id
      - nome
      - unidade
    Status:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
      required:
      - id
      - nome
    Unidade:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        endereco:
          type: string
          maxLength: 200
      required:
      - endereco
      - id
      - nome
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
